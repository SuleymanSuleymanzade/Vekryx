[package]
name = "vector_database"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.21.0", optional = true }
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"

[lib]
name = "vector_database"
crate-type = ["cdylib", "rlib"]
