[package]
name = "vekryx"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[features]
default = []
python = ["dep:pyo3"]
experimental = ["dep:ndarray", "dep:rand"]

[dependencies]
pyo3 = { version = "0.21.0", optional = true }
ndarray = { version = "0.15", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
memmap2 = "0.9"

[lib]
name = "vekryx"
crate-type = ["cdylib", "rlib"]
