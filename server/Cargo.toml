[package]
name = "vekryx-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
actix-web = "4"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
vekryx = { path = ".." }
