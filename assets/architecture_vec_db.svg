<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Vekryx extensible search architecture</title>
  <desc id="desc">Canonical storage feeds a filtered corpus. An index builder creates a metric-bound immutable search session. Candidate retrieval flows through shared validation and optional exact distance reranking into top-k, MMR, or BM25 rank fusion. ExactSearch, HNSW, IVF-Flat, PQ, and residual IVF-PQ are implemented. Snapshots contain canonical records only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #172554; }
      .heading { font-size: 28px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 650; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 14px; fill: #475569; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .core { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="860" rx="20" fill="#f8fafc"/>
  <text x="40" y="48" class="heading">Vekryx · composable search</text>
  <text x="40" y="77" class="body">Canonical data → bound retrieval backend → shared search pipelines</text>

  <rect x="40" y="110" width="340" height="100" rx="12" class="core"/>
  <text x="60" y="143" class="label">Vekryx · canonical storage</text>
  <text x="60" y="170" class="body">Stable IDs, f64 vectors, text, metadata</text>
  <text x="60" y="193" class="small">Owns data; validates inserts and replacements</text>
  <rect x="40" y="250" width="340" height="100" rx="12" class="box"/>
  <text x="60" y="283" class="label">Corpus · borrowed view</text>
  <text x="60" y="310" class="body">Optional metadata filter before limits</text>
  <text x="60" y="333" class="small">Filter-aware vector and record access</text>
  <path d="M 210 210 V 250" class="line"/>

  <rect x="420" y="110" width="340" height="100" rx="12" class="box"/>
  <text x="440" y="143" class="label">Atomic JSON snapshots</text>
  <text x="440" y="170" class="body">Canonical data and dimensions only</text>
  <text x="440" y="193" class="small">No backend state, metric, or query options</text>
  <path d="M 380 160 H 420" class="line" marker-start="url(#arrow)"/>

  <rect x="420" y="250" width="340" height="100" rx="12" class="core"/>
  <text x="440" y="283" class="label">IndexBuilder → SearchSession</text>
  <text x="440" y="310" class="body">Build / train; bind corpus and metric</text>
  <text x="440" y="333" class="small">Rust borrows; Python owns a corpus snapshot</text>
  <path d="M 380 300 H 420" class="line"/>

  <rect x="800" y="110" width="360" height="100" rx="12" class="box"/>
  <text x="820" y="143" class="label">Query + SearchOptions</text>
  <text x="820" y="170" class="body">k, candidates, rerank_exact</text>
  <text x="820" y="193" class="small">Typed backend-specific query controls</text>
  <path d="M 980 210 V 232 H 710 V 250" class="line"/>

  <rect x="420" y="390" width="340" height="100" rx="12" class="core"/>
  <text x="440" y="423" class="label">CandidateIndex</text>
  <text x="440" y="450" class="body">Eligible IDs + distances + precision tags</text>
  <text x="440" y="473" class="small">ExactSearch + ANN; recall is explicit</text>
  <path d="M 590 350 V 390" class="line"/>
  <rect x="800" y="390" width="360" height="100" rx="12" class="core"/>
  <text x="820" y="423" class="label">Built-in ANN backends</text>
  <text x="820" y="450" class="body">HNSW · IVF-Flat · PQ · IVF-PQ</text>
  <text x="820" y="473" class="small">Residual codebooks compose IVF and PQ</text>
  <path d="M 800 440 H 760" class="line"/>

  <rect x="420" y="530" width="340" height="100" rx="12" class="box"/>
  <text x="440" y="563" class="label">Shared candidate processing</text>
  <text x="440" y="590" class="body">Validate, deduplicate, optional exact rerank</text>
  <text x="440" y="613" class="small">Exact distances do not guarantee ANN recall</text>
  <path d="M 590 490 V 530" class="line"/>

  <rect x="40" y="530" width="340" height="100" rx="12" class="box"/>
  <text x="60" y="563" class="label">BM25 keyword ranking</text>
  <text x="60" y="590" class="body">Query text + eligible text records</text>
  <text x="60" y="613" class="small">Optional keyword candidate limit after scoring</text>
  <path d="M 210 350 V 530" class="line"/>

  <rect x="420" y="690" width="220" height="100" rx="12" class="core"/>
  <text x="440" y="723" class="label">Top k</text>
  <text x="440" y="750" class="body">SearchHit</text>
  <text x="440" y="773" class="small">Smaller distance first</text>
  <rect x="680" y="690" width="220" height="100" rx="12" class="core"/>
  <text x="700" y="723" class="label">MMR selection</text>
  <text x="700" y="750" class="body">SearchHit</text>
  <text x="700" y="773" class="small">Selection order</text>
  <rect x="940" y="690" width="220" height="100" rx="12" class="core"/>
  <text x="960" y="723" class="label">Hybrid RRF</text>
  <text x="960" y="750" class="body">FusionHit</text>
  <text x="960" y="773" class="small">Larger fusion score first</text>
  <path d="M 530 630 V 690" class="line"/>
  <path d="M 590 630 V 660 H 790 V 690" class="line"/>
  <path d="M 650 630 V 645 H 1050 V 690" class="line"/>
  <path d="M 210 630 V 815 H 1050 V 790" class="line"/>
  <text x="40" y="845" class="small">Rust sessions and Python options use the same pipelines. Existing tuple APIs remain exact-search compatibility wrappers.</text>
</svg>
